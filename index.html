<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpine – Main nav prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --rail:#062D13; --rail-hover:#0A431D; --tile:#E9FCEF; --tile-fg:#0D5926; --brand:#127D35;
    --rail-icon:#A6A6A6; --rail-text:#A6A6A6; --divider:rgba(166,166,166,.35);
    --btn:#127D35; --btn-hover:#0D5926;
    --text:#1F2328; --text-2:#5B616B; --text-3:#8A9099; --border:#EDEDED; --input-border:#E1E1E1; --ctrl-bg:#EDEDED; --ctrl-hover:#E2E2E2; --bg:#F6F7F8; --surface:#FFFFFF;
    --focus:#2E7D4F; --radius:4px; --card-radius:8px; --rail-w:115px; --top-h:73px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:Roboto,system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}
  svg.i{width:20px;height:20px;fill:currentColor;flex:none}
  :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  .app{display:grid;grid-template-columns:var(--rail-w) 1fr;grid-template-rows:var(--top-h) 1fr;height:100vh}

  /* Rail */
  .rail{grid-row:1 / span 2;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:16px 16px;overflow-y:auto;overflow-x:visible;scrollbar-width:thin}
  .logo{width:48px;height:49px;margin:0 0 28px;flex:none;fill:#fff}
  .rail-group{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
  .rail-divider{width:80px;height:1px;background:var(--divider);margin:16px 0;flex:none}
  .rail-spacer{flex:1 1 auto;min-height:12px}
  .rail-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:83px;padding:8px;border:0;background:transparent;border-radius:4px;cursor:pointer;color:var(--rail-text);text-decoration:none}
  .rail-item svg.i{width:24px;height:24px;color:var(--rail-icon)}
  .rail-item .lbl{font-size:12px;font-weight:500;line-height:18px;text-align:center;white-space:nowrap}
  .rail-item:hover{background:var(--rail-hover)}
  .rail-item[aria-current="page"]{background:var(--tile);color:var(--tile-fg)}
  .rail-item[aria-current="page"] svg.i{color:var(--tile-fg)}
  .rail-item[aria-current="page"] .lbl{font-weight:600}
  .badge{position:absolute;top:2px;left:58px;min-width:23px;height:22px;padding:0 7px;border-radius:9999px;background:#ECF9F0;border:1px solid #C5EDD3;color:#0D5926;font-size:12px;font-weight:500;line-height:20px;text-align:center}
  
  .tip{position:fixed;z-index:60;background:#1F2328;color:#fff;font-size:12px;padding:6px 8px;border-radius:6px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}

  /* Top bar */
  .top{grid-column:2;display:flex;align-items:center;gap:16px;padding:16px 24px 16px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:20}
  .search{display:flex;align-items:center;gap:8px;width:min(480px,40vw);height:40px;padding:0 12px;border:1px solid var(--input-border);border-radius:var(--radius);background:#fff;color:var(--text-3)}
  .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(18,125,53,.12)}
  .search input{border:0;outline:0;flex:1;font:inherit;color:var(--text);background:transparent;min-width:0}
  .kbd{font-size:11px;color:var(--text-3);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
  .grow{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;font-weight:500;background:#fff}
  .btn svg.i{width:18px;height:18px}
  .btn-primary{background:var(--btn);color:#fff}
  .btn-primary:hover{background:var(--btn-hover)}
  .btn-secondary{background:var(--ctrl-bg);color:var(--text)}
  .btn-secondary:hover{background:var(--ctrl-hover)}
  .icon-btn{width:38px;height:38px;padding:0;justify-content:center;background:var(--ctrl-bg)}
  .icon-btn:hover{background:var(--ctrl-hover)}
  .avatar-btn{width:40px;height:40px;border-radius:50%;border:0;padding:0;cursor:pointer;background:#2F6B45;color:#fff;font-weight:600;font-size:14px}
  .wrap{position:relative}

  /* Menus — Dropdown List + _List Items (Alpine Component Library) */
  .menu{position:absolute;top:calc(100% + 6px);right:0;min-width:240px;background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(16,24,40,.10),0 1px 2px -1px rgba(16,24,40,.10),0 0 0 1px rgba(16,24,40,.04);padding:4px 0;z-index:50;display:none;overflow:hidden}
  .menu.open{display:block}
  .menu.left{left:calc(100% + 8px);right:auto;top:auto;bottom:0;position:fixed}
  .mi{display:flex;align-items:flex-start;gap:8px;width:100%;padding:12px 16px;border:0;background:#fff;border-radius:0;text-align:left;cursor:pointer;transition:background-color .12s}
  .mi:hover,.mi:focus-visible{background:#E9FCEF;outline:none}
  .mi svg.i{width:16px;height:16px;margin-top:2px;color:#595959}
  .mi .t{display:block;font-size:14px;line-height:20px;font-weight:400;color:#262626}
  .mi .s{display:block;font-size:12px;line-height:16px;color:#595959;margin-top:2px}
  .mi[aria-checked="true"] .t{font-weight:500}
  .mi .check{margin-left:auto;color:var(--brand)}
  .msep{height:1px;background:#E1E1E1;margin:0}
  .mhead{padding:12px 16px;background:#FAFAFA}
  .mhead b{display:block;font-size:14px;font-weight:600;color:#262626}
  .mhead span{font-size:12px;color:#595959}
  .mlabel{font-size:12px;font-weight:600;color:#595959;background:#FAFAFA;padding:12px 16px}
  /* Content */
  main{grid-column:2;overflow:auto;padding:20px 20px 120px}
  main.shot-page{padding:0;background:#F5F5F5}
  img.shot{display:block;width:100%;max-width:1325px;height:auto}
  .shot-tag{position:sticky;top:0;z-index:2;display:none}
  h1{font-size:24px;line-height:32px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--text-2);margin:0 0 20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--card-radius)}
  table{width:100%;border-collapse:collapse}
  th{font-size:12px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--text-3);text-align:left;padding:12px 16px;border-bottom:1px solid var(--border)}
  td{padding:14px 16px;border-bottom:1px solid var(--border);color:var(--text-2)}
  td:first-child{color:var(--text);font-weight:500}
  tr:last-child td{border-bottom:0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
  .stat{padding:18px 20px}
  .stat b{display:block;font-size:26px;font-weight:600}
  .stat span{color:var(--text-2)}
  .placeholder{padding:48px;text-align:center;color:var(--text-2)}
  .placeholder svg.i{width:32px;height:32px;color:var(--text-3);margin-bottom:8px}
  .note{display:inline-flex;gap:8px;align-items:flex-start;background:#EEF7F1;color:var(--tile-fg);border-radius:6px;padding:10px 12px;margin-bottom:16px;font-size:13px}
  .note svg.i{width:16px;height:16px;margin-top:1px}
  main.settings-page{padding:0;background:#F5F5F5}
  .settings{display:grid;grid-template-columns:161px 1fr;min-height:100%}
  .snav2{background:#FAFAFA;padding-top:40px;display:flex;flex-direction:column;gap:4px}
  .snav2 button{position:relative;height:77px;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;padding:0 16px 0 8px;font-family:Inter,Roboto,sans-serif;font-weight:500;font-size:12px;line-height:18px;text-transform:uppercase;color:#595959;text-align:right}
  .snav2 button svg.i{width:16px;height:16px;color:#595959}
  .snav2 button:hover{color:#262626}
  .snav2 button[aria-current="page"]{color:#262626}
  .snav2 button[aria-current="page"] svg.i{color:#404040}
  .snav2 button[aria-current="page"]::after{content:"";position:absolute;right:6.5px;top:12px;height:53px;width:3px;background:#148D3C;border-radius:2px}
  .snav2 .moved{font-size:9px;line-height:14px;letter-spacing:.4px;color:#148D3C;background:#E9FCEF;border-radius:3px;padding:0 4px;margin-right:6px}
  .snav2 .ic-row{display:flex;align-items:center}
  .settings-body{min-width:0}
  .settings-body .note{margin:16px 16px 0}
  .snav{padding:8px}
  .snav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:transparent;border-radius:6px;cursor:pointer;text-align:left;color:var(--text-2)}
  .snav button svg.i{width:16px;height:16px}
  .snav button:hover{background:#F3F6F4}
  .snav button[aria-current="page"]{background:var(--tile);color:var(--tile-fg);font-weight:600}
  .snav .tag{margin-left:auto;font-size:10px;font-weight:600;color:var(--brand);background:#EEF7F1;border-radius:4px;padding:1px 5px}

  /* Modal + toast */
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center;z-index:80}
  .scrim.open{display:flex}
  .modal{width:min(520px,92vw);background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  .modal header{background:var(--btn);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;font-weight:600}
  .modal header button{background:transparent;border:0;color:#fff;cursor:pointer;padding:4px}
  .modal .body{padding:20px 18px;color:var(--text-2);line-height:1.5}
  .modal footer{padding:12px 18px;display:flex;justify-content:flex-end;border-top:1px solid var(--border)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2328;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}

  /* Prototype controls */
  .ctl{position:fixed;right:16px;bottom:16px;width:300px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(16,24,40,.18);z-index:70;font-size:13px}
  .ctl header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);font-weight:600;cursor:pointer;user-select:none}
  .ctl header svg.i{width:16px;height:16px;color:var(--brand)}
  .ctl header .chev{margin-left:auto;transition:transform .2s}
  .ctl.collapsed header{border-bottom:0}
  .ctl.collapsed .chev{transform:rotate(180deg)}
  .ctl.collapsed .ctl-body{display:none}
  .ctl-body{padding:10px 12px 12px;max-height:60vh;overflow:auto}
  .ctl label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
  .ctl .grp{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text-3);margin:10px 0 4px}
  .ctl .grp:first-child{margin-top:0}
  .diff{margin:6px 0 0;padding-left:18px;color:var(--text-2)}
  .diff li{margin:3px 0}
  @media (max-height:820px){ .rail-item{padding:5px 8px} .logo{width:40px;height:41px;margin:0 0 16px} .rail-divider{margin:8px 0} .rail-group{gap:2px} }
</style>
</head>

    <div class="rail-group" id="g-core"></div>
    <div class="rail-divider" id="d-paid"></div>
    <div class="rail-group" id="g-paid"></div>
    <div class="rail-spacer"></div>
    <div class="rail-group" id="g-bottom"></div>
  </nav>

  <header class="top">
    <label class="search"><span id="ic-search"></span><span class="sr">Search</span>
      <input id="search" placeholder="Search constituents, actions, campaigns…" autocomplete="off">
      <span class="kbd" id="kbd">⌘K</span></label>
    <div class="grow"></div>
    <div class="wrap" id="w-new"></div>
    <div class="wrap" id="w-switch"></div>
    <button class="btn icon-btn" id="help" aria-label="Help Center (opens in a new tab)"></button>
    <div class="wrap" id="w-profile"></div>
  </header>

  <main id="main" tabindex="-1"></main>
</div>

<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="m-title">
  <div class="modal"><header><span id="m-title"></span><button id="m-x" aria-label="Close"></button></header>
    <div class="body" id="m-body"></div>
    <footer><button class="btn btn-secondary" id="m-close">Close</button></footer></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<aside class="ctl collapsed" id="ctl" aria-label="Prototype controls">

    <div class="grp">Signed in as</div>
    <div id="roles"></div>
    <div class="grp">Organization plan</div>
    <label><input type="checkbox" id="paid" checked> Paid features (Pipelines, Insights, Stewardship)</label>
    <div class="grp">This user's features (Staff Members › Features)</div>
    <label><input type="checkbox" id="f-ins" checked> Donor Insights</label>
    <label><input type="checkbox" id="f-stew" checked> Stewardship Automation</label>
    <div class="grp">What's different from today</div>
    <ul class="diff" id="diff"></ul>
  </div>

function railItem(n){
  const cur = state.page===n.id || (n.id==='htru' && state.page.startsWith('tool:'));

  return `<button class="rail-item" data-nav="${n.id}" ${cur?'aria-current="page"':''} aria-label="${aria}"

    ${n.badge?`<span class="badge" aria-hidden="true">${n.badge}</span>`:''}</button>`;
}

  const cur = secs.find(s=>s.id===state.sTab);
  $('main').classList.add('settings-page');
  $('main').innerHTML = `<div class="settings"><nav class="snav2" aria-label="Settings sections">${secs.map(s=>`<button data-stab="${s.id}" ${s.id===state.sTab?'aria-current="page"':''}><span class="ic-row">${s.moved?'<span class="moved">Moved</span>':''}${icon(s.icon)}</span>${s.t}</button>`).join('')}</nav>
    <section class="settings-body">${cur.moved?`<div class="note">${icon('info-circle')}<span>${cur.moved}. Same page and permissions as today.</span></div>`:''}
    ${SETTING_SHOTS[cur.id] ? shot(SETTING_SHOTS[cur.id], cur.t) : `<div class="card placeholder">${icon('info-circle')}<div><b style="color:var(--text)">${cur.t}</b><br>Existing settings page — unchanged by the nav project.</div></div>`}</section></div>`;
}
function renderCtl(){
  $('roles').innerHTML = Object.entries(ROLES).map(([k,v])=>`<label><input type="radio" name="role" value="${k}" ${k===state.role?'checked':''}> ${v.label}</label>`).join('');
  $('diff').innerHTML = DIFF[state.role].map(d=>`<li>${d}</li>`).join('');
  $('paid').checked = state.paid; $('f-ins').checked = state.fIns; $('f-stew').checked = state.fStew;
}
function allowed(p){
  if (p==='settings') return NAV.find(n=>n.id==='settings').ok();
  if (p.startsWith('tool:')) return has('alpine');
  const n = NAV.find(x=>x.id===p); return !!(n && n.ok() && !n.menu);
}
function render(){
  if (!allowed(state.page)) state.page = NAV.find(n=>n.ok() && !n.menu).id;
  renderRail(); renderTop(); renderMain(); renderCtl();
  const hh = toHash(state.page); if (location.hash.slice(1)!==hh) history.replaceState(null,'','#'+hh);
}

/* ---------- Menus ---------- */
let openMenu = null, openBtn = null;
function closeMenu(focusBtn){
  if (!openMenu) return;
  openMenu.classList.remove('open'); openBtn.setAttribute('aria-expanded','false');
  if (focusBtn) openBtn.focus();
  openMenu = openBtn = null;
}
function toggleMenu(btn, menu, focusFirst){
  if (openMenu === menu) return closeMenu(true);
  closeMenu();
  menu.classList.add('open'); btn.setAttribute('aria-expanded','true');
  openMenu = menu; openBtn = btn;
  if (menu.id==='m-htru'){ const r = btn.getBoundingClientRect(); menu.classList.add('left'); menu.style.left = (r.right+8)+'px'; menu.style.bottom = (innerHeight - r.bottom)+'px'; }
  if (focusFirst) menu.querySelector('.mi')?.focus();
}
const items = () => [...openMenu.querySelectorAll('.mi')];

document.addEventListener('click', e=>{
  const t = e.target.closest('button,[data-nav]');
  if (!t){ closeMenu(); return; }
  if (t.id==='b-new') return toggleMenu(t, $('m-new'), e.detail===0);
  if (t.id==='b-switch') return toggleMenu(t, $('m-switch'), e.detail===0);
  if (t.id==='b-profile') return toggleMenu(t, $('m-profile'), e.detail===0);
  if (t.dataset.nav==='htru') return toggleMenu(t, $('m-htru'), e.detail===0);
  if (t.dataset.nav){ closeMenu(); state.page = t.dataset.nav; render(); $('main').focus({preventScroll:true}); return; }
  if (t.dataset.tool){ closeMenu(); state.page = 'tool:'+t.dataset.tool; render(); return; }
  if (t.dataset.stab){ state.sTab = t.dataset.stab; renderSettings(); return; }
  if (t.dataset.create){ const c = CREATE.find(x=>x.id===t.dataset.create); closeMenu(); return openModal(c); }
  if (t.dataset.product){ closeMenu(); if (t.dataset.product!=='alpine') toast(`Opens ${t.dataset.product} in a new tab`); return; }
  if (t.dataset.acct){ closeMenu(); return toast(t.dataset.acct==='profile' ? 'Opens your profile (unchanged)' : 'Signs you out'); }
  if (t.id==='help'){ closeMenu(); return toast('Opens the Help Center in a new tab'); }
  if (t.id==='m-close' || t.id==='m-x') return closeModal();
  if (!t.closest('.menu')) closeMenu();
});
document.addEventListener('keydown', e=>{
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); closeMenu(); $('search').focus(); return; }
  if (e.key==='Escape'){ if ($('scrim').classList.contains('open')) return closeModal(); if (openMenu) return closeMenu(true); }
  if (openMenu && ['ArrowDown','ArrowUp','Home','End'].includes(e.key)){
    e.preventDefault(); const it = items(); let i = it.indexOf(document.activeElement);
    i = e.key==='ArrowDown' ? (i+1)%it.length : e.key==='ArrowUp' ? (i-1+it.length)%it.length : e.key==='Home' ? 0 : it.length-1;
    it[i].focus();
  }
  if (!openMenu && e.key==='ArrowDown' && ['b-new','b-switch','b-profile'].includes(document.activeElement.id)){ e.preventDefault(); document.activeElement.click(); }
  if (e.key==='Tab' && openMenu && !openMenu.contains(document.activeElement)) closeMenu();
});
$('search').addEventListener('keydown', e=>{ if (e.key==='Enter' && e.target.value.trim()) toast('Search results open here (unchanged)'); });

/* ---------- Tooltip for badge ---------- */
let tipEl = null;
function showTip(el){ hideTip(); tipEl = document.createElement('div'); tipEl.className='tip'; tipEl.textContent = el.dataset.tip; document.body.appendChild(tipEl);
  const r = el.getBoundingClientRect(); tipEl.style.left = (r.right+8)+'px'; tipEl.style.top = (r.top + r.height/2 - tipEl.offsetHeight/2)+'px'; }
function hideTip(){ tipEl?.remove(); tipEl = null; }
document.addEventListener('mouseover', e=>{ const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('mouseout', e=>{ if (e.target.closest('[data-tip]')) hideTip(); });
document.addEventListener('focusin', e=>{ const el = e.target.closest('[data-tip]'); el ? showTip(el) : hideTip(); });

/* ---------- Modal + toast ---------- */
let lastFocus = null;
function openModal(c){
  lastFocus = document.activeElement;
  $('m-title').textContent = c.t==='Constituent' ? 'Add Constituent' : c.t==='Manual action' ? 'Add Manual Action' : c.t==='Blueprint action' ? 'Add Blueprint Action' : c.t==='Batch of actions' ? 'Add Batch Actions' : 'Bulk Upload';
  $('m-body').innerHTML = `In the real product this opens <b>today’s ${$('m-title').textContent} screen</b>, unchanged. The nav project only changes where you start it from.`;
  $('scrim').classList.add('open'); $('m-close').focus();
}
function closeModal(){ $('scrim').classList.remove('open'); lastFocus?.focus(); }
$('scrim').addEventListener('click', e=>{ if (e.target.id==='scrim') closeModal(); });
let tt; function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200); }

/* ---------- Controls ---------- */
$('ctl').addEventListener('change', e=>{
  if (e.target.name==='role') state.role = e.target.value;
  if (e.target.id==='paid') state.paid = e.target.checked;
  if (e.target.id==='f-ins') state.fIns = e.target.checked;
  if (e.target.id==='f-stew') state.fStew = e.target.checked;
  closeMenu(); render();
});
function toggleCtl(){ const c=$('ctl'); c.classList.toggle('collapsed'); $('ctl-h').setAttribute('aria-expanded', String(!c.classList.contains('collapsed'))); }
$('ctl-h').addEventListener('click', toggleCtl);
$('ctl-h').addEventListener('keydown', e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleCtl(); } });

/* ---------- Init ---------- */
$('ic-search').innerHTML = icon('search'); $('help').innerHTML = icon('question-circle');
$('m-x').innerHTML = icon('x-lg'); $('ic-sl').innerHTML = icon('sliders'); $('ic-chev').innerHTML = icon('chevron-down');
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('kbd').textContent = 'Ctrl K';
function toHash(p){ return p==='settings' ? 'org-settings' : p.replace('tool:','tool-'); }
function fromHash(){ const h = location.hash.slice(1); if (!h) return; state.page = h==='org-settings' ? 'settings' : h.startsWith('tool-') ? 'tool:'+h.slice(5) : h; }
fromHash(); render();
addEventListener('hashchange', ()=>{ fromHash(); render(); });
</script>
</body>
</html>
